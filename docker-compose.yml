services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saarathi-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - PORT=8000
      - HOST=0.0.0.0
    env_file:
      - ./backend/.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - saarathi-network

networks:
  saarathi-network:
    driver: bridge
